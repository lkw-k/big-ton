spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doldari}
    username: ${DB_USERNAME:doldari}
    password: ${DB_PASSWORD:doldari}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}

server:
  port: 8080

agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
  internal-token: ${INTERNAL_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health

llm:
  max-attempts: 3
